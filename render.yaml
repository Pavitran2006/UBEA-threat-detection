services:
  - type: web
    name: ueba-threat-detection
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SIMULATION
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ueba-postgres
          property: connectionString

databases:
  - name: ueba-postgres
    databaseName: ueba_system
    user: ueba_admin
    plan: free
    region: oregon
